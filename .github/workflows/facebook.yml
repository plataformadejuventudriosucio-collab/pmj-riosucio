name: Sincronizar Facebook

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: facebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer publicaciones de la Página
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '536756083334696' }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v27.0' }}
        run: python scripts/facebook_sync.py
      - name: Guardar cambios (Netlify publica solo)
        run: |
          git config user.name "Robot PMJ"
          git config user.email "actions@users.noreply.github.com"
          git add data/facebook.json img/fb-auto
          if git diff --cached --quiet; then
            echo "Sin publicaciones nuevas."
          else
            git commit -m "Facebook: nuevas publicaciones $(date -u +%Y-%m-%d)"
            git push
          fi
